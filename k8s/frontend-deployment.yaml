apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: student-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: student-assistant-frontend:latest
        ports:
        - containerPort: 7860
        envFrom:
        - configMapRef:
            name: app-config
