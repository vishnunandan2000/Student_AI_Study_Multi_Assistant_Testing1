apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: student-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: student-assistant-backend:latest
        command: ["celery", "-A", "backend.worker", "worker", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
