services:
  - type: web
    name: ai-student-study-assistant
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python frontend/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: OLLAMA_BASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
